<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070D">
<title>Agendar horário</title>
<style>
/* Página pública de agendamento. Mesmo tema do painel: preto azulado com azul elétrico. */
:root{
  color-scheme:dark;
  --bg:#05070D; --cell:rgba(255,255,255,.045); --fg:#F3F6FC; --fg2:#8C96AB; --fg3:#4B546A;
  --line:rgba(255,255,255,.09); --fill:rgba(255,255,255,.07);
  --tint:#5B9DFF; --tint-hi:#9CC3FF; --on-tint:#FFFFFF;
  --grad:linear-gradient(135deg,#5AA2FF 0%,#2167FF 100%); --glow:rgba(47,123,255,.55);
  --green:#3DDC97; --green-bg:rgba(61,220,151,.14); --red:#FF6B7A; --red-bg:rgba(255,107,122,.14);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(110% 55% at 50% -12%,rgba(47,123,255,.26),transparent 62%)}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:8px}
.num{font-family:var(--round);font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}
.head .sub{font-size:13px;color:var(--tint-hi);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.head h1{margin:2px 0 0;font-size:34px;font-weight:700;letter-spacing:-.4px;line-height:1.1;text-wrap:balance}
.lbl{font-size:13px;color:var(--fg2);text-transform:uppercase;letter-spacing:.3px;padding:0 4px;margin-bottom:-8px;display:flex;gap:8px;align-items:center}
.lbl b{width:20px;height:20px;border-radius:10px;background:rgba(91,157,255,.18);color:var(--tint-hi);display:grid;place-items:center;font-size:12px}
.grp{background:var(--cell);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px;width:100%}
.row+.row{border-top:1px solid var(--line)}
.row .main{flex:1;min-width:0}
.row .t{font-size:17px;overflow-wrap:anywhere}
.row .s{font-size:14px;color:var(--fg2)}
.row .mk{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--fg3);flex:none}
.row.on{background:rgba(91,157,255,.12)}
.row .mk{border-radius:7px}
.row.on .mk{border:0;background:var(--grad);box-shadow:0 4px 12px -2px var(--glow);position:relative}
.row.on .mk::after{content:"";position:absolute;left:8px;top:4px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
label.row>span:first-child{flex:none}
.row input{flex:1;min-width:0;border:0;background:none;text-align:right;outline:none;height:30px}
.row input::placeholder{color:var(--fg3)}
.dias{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.dias::-webkit-scrollbar{display:none}
.dia{flex:none;width:62px;padding:10px 0;border-radius:16px;background:var(--cell);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px}
.dia .w{font-size:12px;color:var(--fg2);text-transform:uppercase;font-weight:600}
.dia .n{font-size:22px;font-weight:600}
.dia .m{font-size:11px;color:var(--fg2)}
.dia.on{background:var(--grad);border-color:transparent;box-shadow:0 8px 22px -8px var(--glow)}
.dia.on .w,.dia.on .m{color:rgba(255,255,255,.85)}
.dia:disabled{opacity:.35;cursor:default}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{height:46px;border-radius:13px;background:var(--cell);border:1px solid var(--line);text-align:center;font-weight:600}
.slot.on{background:var(--grad);border-color:transparent;box-shadow:0 8px 22px -8px var(--glow)}
.vazio{background:var(--cell);border:1px solid var(--line);border-radius:18px;padding:22px 18px;text-align:center;color:var(--fg2);font-size:15px}
.resumo{background:linear-gradient(160deg,#15367C 0%,#0C1B40 52%,#0A1124 100%);border:1px solid rgba(110,165,255,.34);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:4px;box-shadow:0 24px 50px -24px var(--glow)}
.resumo .k{font-size:13px;color:rgba(214,228,255,.72)}
.resumo .v{font-family:var(--round);font-size:26px;font-weight:700;letter-spacing:-.3px}
.btn{height:54px;border-radius:16px;background:var(--grad);color:var(--on-tint);font-weight:600;text-align:center;box-shadow:0 12px 28px -12px var(--glow);width:100%}
.btn:disabled{opacity:.4;box-shadow:none;cursor:default}
.btn2{height:46px;color:var(--tint);text-align:center;width:100%}
.msg{margin:0;font-size:14px;color:var(--red);min-height:18px;padding:0 4px}
.ok{align-items:center;text-align:center;gap:14px;display:flex;flex-direction:column;padding-top:8vh}
.ok .ck{width:72px;height:72px;border-radius:36px;background:var(--green-bg);display:grid;place-items:center;color:var(--green)}
.ok h1{margin:0;font-size:28px;font-weight:700}
.ok p{margin:0;color:var(--fg2);font-size:15px;max-width:34ch}
.meu{display:flex;flex-direction:column;gap:10px;padding:14px 16px}
.meu+.meu{border-top:1px solid var(--line)}
.meu .t{font-size:17px;font-weight:600}
.meu .s{font-size:14px;color:var(--fg2)}
.mb{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mb button{height:42px;border-radius:12px;background:rgba(91,157,255,.15);color:var(--tint-hi);text-align:center;font-weight:600;font-size:15px}
.mb button.dg{background:var(--red-bg);color:var(--red)}
.total{display:flex;justify-content:space-between;align-items:center;gap:12px;background:rgba(91,157,255,.12);border:1px solid rgba(110,165,255,.34);border-radius:14px;padding:12px 16px;font-size:15px;color:var(--tint-hi)}
.total b{font-size:20px;color:var(--fg)}
.tipo{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:13px;padding:3px}
.tipo button{flex:1;height:40px;border-radius:10px;text-align:center;font-weight:600;font-size:15px;color:var(--fg2)}
.tipo button.on{background:rgba(91,157,255,.2);color:var(--fg);box-shadow:inset 0 0 0 1px rgba(110,165,255,.42)}
.dica{margin:-6px 4px 0;font-size:13px;color:var(--fg2)}
.nota{background:var(--green-bg);color:var(--green);border-radius:14px;padding:12px 14px;font-size:15px}
.nota.ruim{background:var(--red-bg);color:var(--red)}
.foot{font-size:12px;color:var(--fg3);text-align:center}
@media (max-width:360px){.slots{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main id="app"><div class="vazio">Carregando…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const mins=h=>{const p=String(h||"0:0").split(":").map(Number);return p[0]*60+(p[1]||0)};
const hm=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const R=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v||0);
const fmt=(s,o)=>parse(s).toLocaleDateString("pt-BR",o);
const telDig=t=>{const d=String(t).replace(/\D/g,"");return d.length>11&&d.slice(0,2)==="55"?d.slice(2):d};

const CFG=window.APP_CONFIG||{};
const SLUG=(new URLSearchParams(location.search).get("b")||"").toLowerCase();
const DIAS=14;      // quantos dias à frente o cliente pode marcar
const PASSO=30;     // intervalo entre opções de horário, em minutos
const ANTECEDENCIA=30; // não oferece horários a menos de X minutos de agora
let sb=null,INFO=null,OCUP=[],MEUS=[];
const E={servicos:[],dia:"",hora:"",enviando:false,feito:null,erro:"",remarcar:null,cancelar:"",aviso:""};
try{E.nome=localStorage.getItem("agenda.nome")||"";E.tel=localStorage.getItem("agenda.tel")||"";E.tipo=localStorage.getItem("agenda.tipo")==="mensal"?"mensal":"avulso"}catch(e){E.nome="";E.tel="";E.tipo="avulso"}

// Códigos dos horários marcados neste aparelho: é o que permite remarcar ou cancelar sem login.
const TKEY="agenda.tk."+SLUG;
let TK=[];
try{TK=JSON.parse(localStorage.getItem(TKEY)||"[]");if(!Array.isArray(TK))TK=[]}catch(e){TK=[]}
function guardaToken(t){
  if(!t||String(t).length<32||TK.includes(t))return;
  TK.push(t);TK=TK.slice(-30);
  try{localStorage.setItem(TKEY,JSON.stringify(TK))}catch(e){}
}
const linkMeu=t=>location.origin+location.pathname+"?b="+encodeURIComponent(SLUG)+"&h="+t;
const quando=(d,h)=>fmt(d,{weekday:"short",day:"numeric",month:"short"})+" às "+h;

// serviços escolhidos, na ordem da lista; o tempo e o valor são a soma deles
const selecionados=()=>INFO.servicos.filter(s=>E.servicos.includes(s.id));
const durSel=()=>selecionados().reduce((t,s)=>t+(Number(s.duracao)||30),0);
const precoSel=()=>selecionados().reduce((t,s)=>t+(Number(s.preco)||0),0);
const nomeSel=()=>selecionados().map(s=>s.nome).join(" + ");
const durTxt=m=>{const h=Math.floor(m/60),r=m%60;return(h?h+" h":"")+(h&&r?" ":"")+(r?r+" min":"")};
function folga(d){return(INFO.config.folgas||[]).includes(parse(d).getDay())}
function livres(d){
  const rm=E.remarcar,tem=E.servicos.length>0;
  if((!tem&&!rm)||folga(d))return[];
  const c=INFO.config,dur=rm?Number(rm.duracao)||30:durSel(),fim=mins(c.fecha);
  let cur=mins(c.abre);
  if(d===INFO.hoje)cur=Math.max(cur,Math.ceil((mins(INFO.agora)+ANTECEDENCIA)/10)*10);
  // ao remarcar, o horário atual do próprio cliente conta como livre
  const oc=OCUP.filter(o=>o.data===d&&!(rm&&rm.data===d&&o.ini===mins(rm.hora))).map(o=>[o.ini,o.fim]);
  if(c.almocoIni&&c.almocoFim&&mins(c.almocoFim)>mins(c.almocoIni))oc.push([mins(c.almocoIni),mins(c.almocoFim)]);
  oc.sort((a,b)=>a[0]-b[0]);
  const out=[];
  const fatia=(a,b)=>{for(let t=a;t+dur<=b;t+=PASSO)out.push(hm(t))};
  for(const o of oc){if(o[0]>cur&&cur<fim)fatia(cur,Math.min(o[0],fim));cur=Math.max(cur,o[1])}
  if(cur<fim)fatia(cur,fim);
  return rm&&rm.data===d?out.filter(t=>t!==rm.hora):out;
}

function blocoMeus(){
  if(!MEUS.length)return"";
  const prazo=Number(INFO.config.prazoAlterar);
  return'<div class="lbl">Seus horários</div><div class="grp">'+MEUS.map(m=>'<div class="meu"><div class="main"><span class="t">'+quando(m.data,esc(m.hora))+'</span><br><span class="s">'+esc(m.servicoNome)+'</span></div>'
    +(m.podeAlterar?'<div class="mb"><button data-act="remarcar" data-tk="'+esc(m.token)+'">Remarcar</button><button class="dg" data-act="cancelar" data-tk="'+esc(m.token)+'">'+(E.cancelar===m.token?"Confirmar cancelamento":"Cancelar")+'</button></div>'
      :'<span class="s">Faltam menos de '+(prazo||2)+' h. Para alterar, fale com a barbearia.</span>')+'</div>').join("")+'</div>';
}
function render(){
  const app=$("#app");
  if(E.feito){
    const f=E.feito;
    app.innerHTML='<div class="ok"><div class="ck"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>'
      +'<h1>'+f.titulo+'</h1><p>'+esc(f.servico)+' na '+esc(INFO.nome)+'</p>'
      +'<div class="resumo" style="width:100%;text-align:left"><span class="k">'+fmt(f.dia,{weekday:"long",day:"numeric",month:"long"})+'</span><span class="v">'+esc(f.hora)+'</span>'+(f.nome?'<span class="k">'+esc(f.nome)+'</span>':"")+'</div>'
      +(f.semanas&&f.semanas.length?'<div class="grp" style="width:100%;text-align:left"><div class="meu"><div class="main"><span class="t">Cliente mensal</span><br><span class="s">Quer garantir o mesmo horário nas próximas semanas de '+fmt(f.dia,{month:"long"})+'? Dias: '+f.semanas.map(d=>parse(d).getDate()).join(", ")+'.</span></div>'
        +'<div class="mb" style="grid-template-columns:1fr"><button data-act="repetir"'+(E.enviando?" disabled":"")+'>'+(E.enviando?"Marcando…":"Marcar toda "+fmt(f.dia,{weekday:"long"})+" às "+esc(f.hora))+'</button></div></div></div>':"")
      +(f.repetiu?'<div class="nota'+(f.repetiu.ruim?" ruim":"")+'" style="width:100%;text-align:left">'+esc(f.repetiu.txt)+'</div>':"")
      +'<p>Para remarcar ou cancelar, abra este mesmo link neste aparelho: seu horário aparece no topo da página.</p>'
      +(f.token?'<button class="btn2" data-act="copiar" data-tk="'+esc(f.token)+'">Copiar link do meu horário</button><p class="msg" id="msg" style="color:var(--fg2);text-align:center"></p>':"")
      +'<button class="btn2" data-act="outro">Voltar para a agenda</button></div>';
    return;
  }
  const rm=E.remarcar,sv=E.servicos.length>0,nsel=selecionados().length;
  let h='<header class="head"><div class="sub">Agendamento online</div><h1>'+esc(INFO.nome)+'</h1></header>';
  if(E.aviso)h+='<div class="nota'+(E.avisoRuim?" ruim":"")+'">'+esc(E.aviso)+'</div>';
  let n=0;const passo=t=>'<div class="lbl"><b>'+(++n)+'</b>'+t+'</div>';
  if(rm){
    h+='<div class="resumo"><span class="k">Remarcando '+esc(rm.servicoNome)+'</span><span class="v">'+quando(rm.data,esc(rm.hora))+'</span><span class="k">Escolha o novo dia e horário. O horário atual só é liberado quando você confirmar.</span></div>'
      +'<button class="btn2" data-act="desistir">Manter como está</button>';
  }else{
    h+=blocoMeus();
    if(!INFO.servicos.length){app.innerHTML=h+'<div class="vazio">A barbearia ainda não cadastrou os serviços. Tente de novo mais tarde.</div>';return}
    h+=passo(MEUS.length?"Marcar outro horário: escolha os serviços":"Escolha um ou mais serviços")+'<div class="grp">'
      +INFO.servicos.map(s=>'<button class="row'+(E.servicos.includes(s.id)?" on":"")+'" data-act="servico" data-id="'+esc(s.id)+'" aria-pressed="'+E.servicos.includes(s.id)+'"><span class="mk"></span><span class="main"><span class="t">'+esc(s.nome)+'</span><br><span class="s">'+(Number(s.duracao)||30)+' min</span></span><span class="num">'+R(s.preco)+'</span></button>').join("")+'</div>';
  }
  if(sv&&!rm)h+='<div class="total"><span>'+nsel+(nsel===1?" serviço":" serviços")+' · '+durTxt(durSel())+'</span><b class="num">'+R(precoSel())+'</b></div>';
  if(sv||rm){
    let dias="";
    for(let i=0;i<DIAS;i++){const d=addDays(INFO.hoje,i),sem=!livres(d).length;
      dias+='<button class="dia'+(d===E.dia?" on":"")+'" data-act="dia" data-d="'+d+'"'+(sem?" disabled":"")+' aria-label="'+fmt(d,{weekday:"long",day:"numeric",month:"long"})+(sem?", sem horários":"")+'"><span class="w">'+(i===0?"hoje":fmt(d,{weekday:"short"}).replace(".",""))+'</span><span class="n num">'+parse(d).getDate()+'</span><span class="m">'+fmt(d,{month:"short"}).replace(".","")+'</span></button>'}
    h+=passo("Escolha o dia")+'<div class="dias">'+dias+'</div>';
    if(E.dia){
      const sl=livres(E.dia);
      h+=passo("Horários livres · "+fmt(E.dia,{weekday:"long",day:"numeric",month:"long"}))
        +(sl.length?'<div class="slots">'+sl.map(t=>'<button class="slot num'+(t===E.hora?" on":"")+'" data-act="hora" data-h="'+t+'" aria-pressed="'+(t===E.hora)+'">'+t+'</button>').join("")+'</div>':'<div class="vazio">Sem horários livres nesse dia. Escolha outro dia.</div>');
      if(E.erro&&!E.hora)h+='<p class="msg" role="alert">'+esc(E.erro)+'</p>';
    }
    if(E.dia&&E.hora&&rm){
      h+='<div class="resumo"><span class="k">Novo horário · '+esc(rm.servicoNome)+'</span><span class="v">'+quando(E.dia,esc(E.hora))+'</span></div>'
        +'<p class="msg" id="msg" role="alert">'+esc(E.erro)+'</p>'
        +'<button class="btn" data-act="confirmar-remarcar"'+(E.enviando?" disabled":"")+'>'+(E.enviando?"Remarcando…":"Confirmar novo horário")+'</button>';
    }else if(E.dia&&E.hora){
      h+=passo("Seus dados")+'<div class="grp"><label class="row"><span>Nome</span><input id="f-nome" type="text" autocomplete="name" placeholder="Seu nome" value="'+esc(E.nome)+'"></label>'
        +'<label class="row"><span>WhatsApp</span><input id="f-tel" type="tel" autocomplete="tel" inputmode="tel" placeholder="(11) 90000-0000" value="'+esc(E.tel)+'"></label></div>'
        +'<div class="tipo" role="group" aria-label="Tipo de cliente"><button class="'+(E.tipo==="avulso"?"on":"")+'" data-act="tipo" data-t="avulso" aria-pressed="'+(E.tipo==="avulso")+'">Avulso</button><button class="'+(E.tipo==="mensal"?"on":"")+'" data-act="tipo" data-t="mensal" aria-pressed="'+(E.tipo==="mensal")+'">Mensalista</button></div>'
        +'<p class="dica">'+(E.tipo==="mensal"?"Plano mensal: depois de confirmar, você pode repetir este horário toda semana até o fim do mês. A barbearia confirma o seu plano.":"Avulso: você paga por atendimento, direto na barbearia.")+'</p>'
        +'<div class="resumo"><span class="k">'+esc(nomeSel())+' · '+durTxt(durSel())+' · '+(E.tipo==="mensal"?"plano mensal":R(precoSel()))+'</span><span class="v">'+quando(E.dia,esc(E.hora))+'</span></div>'
        +'<p class="msg" id="msg" role="alert">'+esc(E.erro)+'</p>'
        +'<button class="btn" data-act="confirmar"'+(E.enviando?" disabled":"")+'>'+(E.enviando?"Marcando…":"Confirmar horário")+'</button>';
    }
  }
  app.innerHTML=h+'<p class="foot">Seus dados são usados só para a barbearia confirmar o seu horário.</p>';
}

async function ocupados(){
  const r=await sb.rpc("agenda_ocupados",{p_slug:SLUG,p_de:INFO.hoje,p_ate:addDays(INFO.hoje,DIAS)});
  if(!r.error&&Array.isArray(r.data))OCUP=r.data;
}
async function meus(){
  if(!TK.length){MEUS=[];return}
  const r=await sb.rpc("agenda_meus",{p_slug:SLUG,p_tokens:TK});
  if(!r.error&&Array.isArray(r.data))MEUS=r.data;
}
const atualiza=()=>Promise.all([ocupados(),meus()]);
const erroTxt=(e,padrao)=>{const m=String(e&&e.message||"");return m&&m.length<140&&!/fetch|network|JSON|function|schema/i.test(m)?m:padrao};
async function iniciar(){
  const falha=m=>{$("#app").innerHTML='<div class="vazio">'+m+'</div>'};
  if(!SLUG)return falha("Link incompleto. Peça o link de agendamento para a barbearia.");
  if(!window.supabase||!CFG.SUPABASE_URL)return falha("Não foi possível carregar. Confira a internet e abra o link de novo.");
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
  const r=await sb.rpc("agenda_info",{p_slug:SLUG});
  if(r.error)return falha("Não foi possível carregar a agenda. Confira a internet e tente de novo.");
  if(!r.data)return falha("Barbearia não encontrada. Confira o link com a barbearia.");
  INFO=r.data;document.title="Agendar · "+INFO.nome;
  guardaToken(new URLSearchParams(location.search).get("h"));
  if(INFO.servicos.length===1)E.servicos=[INFO.servicos[0].id];
  await atualiza();render();
}
function guarda(){const n=$("#f-nome"),t=$("#f-tel");if(n)E.nome=n.value;if(t)E.tel=t.value}
function limpa(){E.dia="";E.hora="";E.erro="";E.cancelar="";E.aviso=""}
const ACT={
  servico(el){guarda();const i=E.servicos.indexOf(el.dataset.id);if(i>=0)E.servicos.splice(i,1);else E.servicos.push(el.dataset.id);E.hora="";E.erro="";E.aviso="";if(E.dia&&!livres(E.dia).length)E.dia="";render()},
  dia(el){guarda();E.dia=el.dataset.d;E.hora="";E.erro="";render()},
  hora(el){guarda();E.hora=el.dataset.h;E.erro="";render();const b=$(".btn");if(b)b.scrollIntoView({block:"end",behavior:"smooth"})},
  tipo(el){guarda();E.tipo=el.dataset.t==="mensal"?"mensal":"avulso";render()},
  outro(){E.feito=null;limpa();render();window.scrollTo(0,0)},
  remarcar(el){const m=MEUS.find(x=>x.token===el.dataset.tk);if(!m)return;guarda();limpa();E.remarcar=m;render();window.scrollTo(0,0)},
  desistir(){E.remarcar=null;limpa();render()},
  copiar(el){
    const t=linkMeu(el.dataset.tk),m=$("#msg");
    const falhou=()=>{if(m)m.textContent=t};
    try{navigator.clipboard.writeText(t).then(()=>{if(m)m.textContent="Link copiado. Guarde para abrir em outro aparelho."},falhou)}catch(e){falhou()}
  },
  async repetir(){
    const f=E.feito;if(!f||!f.token)return;
    E.enviando=true;render();
    const r=await sb.rpc("agenda_repetir",{p_slug:SLUG,p_token:f.token});
    E.enviando=false;f.semanas=[];
    if(r.error)f.repetiu={ruim:true,txt:erroTxt(r.error,"Não foi possível marcar as outras semanas. Confira a internet e tente de novo.")};
    else{
      const c=r.data.criados||[],p=r.data.pulados||[],dia=d=>fmt(d,{day:"numeric",month:"numeric"});
      c.forEach(x=>guardaToken(x.token));
      f.repetiu={ruim:!c.length,txt:(c.length?"Também marcado: "+c.map(x=>dia(x.data)).join(", ")+".":"Nenhuma das outras semanas tinha esse horário livre.")+(p.length&&c.length?" Sem vaga em: "+p.map(dia).join(", ")+".":"")};
    }
    await atualiza();render();
  },
  async cancelar(el){
    const tk=el.dataset.tk;
    if(E.cancelar!==tk){E.cancelar=tk;return render()}
    E.cancelar="";
    const r=await sb.rpc("agenda_cancelar",{p_slug:SLUG,p_token:tk});
    E.avisoRuim=!!r.error;
    E.aviso=r.error?erroTxt(r.error,"Não foi possível cancelar agora. Confira a internet e tente de novo."):"Horário cancelado. A barbearia já foi avisada pela agenda.";
    await atualiza();render();window.scrollTo(0,0);
  },
  async "confirmar-remarcar"(){
    const rm=E.remarcar;if(!rm)return;
    E.erro="";E.enviando=true;render();
    const r=await sb.rpc("agenda_remarcar",{p_slug:SLUG,p_token:rm.token,p_data:E.dia,p_hora:E.hora});
    E.enviando=false;
    if(r.error){
      E.erro=erroTxt(r.error,"Não foi possível remarcar agora. Confira a internet e tente de novo.");
      await atualiza();if(!livres(E.dia).includes(E.hora))E.hora="";
      return render();
    }
    E.feito={titulo:"Horário remarcado",servico:rm.servicoNome,dia:E.dia,hora:E.hora,nome:"",token:rm.token};
    E.remarcar=null;await atualiza();render();window.scrollTo(0,0);
  },
  async confirmar(){
    guarda();
    const nome=E.nome.trim(),tel=telDig(E.tel);
    if(nome.length<2){E.erro="Informe seu nome.";return render()}
    if(tel.length<10||tel.length>11){E.erro="Informe seu WhatsApp com DDD.";return render()}
    E.erro="";E.enviando=true;render();
    const feitoNome=nomeSel();
    const r=await sb.rpc("agenda_marcar",{p_slug:SLUG,p_servico:selecionados().map(s=>s.id).join(","),p_data:E.dia,p_hora:E.hora,p_nome:nome,p_telefone:E.tel.trim(),p_mensal:E.tipo==="mensal"});
    E.enviando=false;
    if(r.error){
      E.erro=erroTxt(r.error,"Não foi possível marcar agora. Confira a internet e tente de novo.");
      await atualiza();if(!livres(E.dia).includes(E.hora))E.hora="";
      return render();
    }
    try{localStorage.setItem("agenda.nome",nome);localStorage.setItem("agenda.tel",E.tel.trim());localStorage.setItem("agenda.tipo",E.tipo)}catch(e){}
    guardaToken(r.data&&r.data.token);
    E.feito={titulo:"Horário marcado",servico:feitoNome,dia:E.dia,hora:E.hora,nome:nome,token:r.data&&r.data.token,semanas:[]};
    if(r.data&&(r.data.repetir||r.data.mensalista))for(let d=addDays(E.dia,7);d.slice(0,7)===E.dia.slice(0,7);d=addDays(d,7))E.feito.semanas.push(d);
    await atualiza();render();window.scrollTo(0,0);
  }
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el&&!el.disabled&&ACT[el.dataset.act])ACT[el.dataset.act](el)});
iniciar();
})();
</script>
</body>
</html>
